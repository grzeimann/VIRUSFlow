version: 1

# Default policy for kinds without explicit sections
defaults:
  policy: soft

kinds:
  master_ldls:
    policy: soft
    metrics:
      p95:
        from: "reduce.percentile(meta.component.data,95)"
        default: 0.0
    checks:
      - id: "flat_signal_present"
        where: "p95 > 0.0"
        severity: warn_if_false

  master_bias:
    policy: soft
    metrics: {}
    checks: []

  master_dark:
    policy: soft
    metrics: {}
    checks: []

  master_arc:
    policy: soft
    metrics:
      p95:
        from: "reduce.percentile(meta.component.data,95)"
        default: 0.0
    checks:
      - id: "arc_signal_present"
        where: "p95 > 0.0"
        severity: warn_if_false
